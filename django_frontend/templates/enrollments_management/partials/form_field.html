<div class="student-form-field">
    <label for="{{ field.id_for_label }}">
        {{ field.label }}

        {% if field.field.required %}
            <span aria-hidden="true">*</span>
        {% endif %}
    </label>

    {{ field }}

    {% if field.help_text %}
        <small class="student-form-help">
            {{ field.help_text }}
        </small>
    {% endif %}

    <div
        class="student-form-errors"
        id="id_{{ field.name }}_errors"
        aria-live="polite"
    >
        {% for error in field.errors %}
            <span>{{ error }}</span>
        {% endfor %}
    </div>
</div>
