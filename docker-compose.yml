name: student-enrollment-system

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile

    image: student-enrollment-api:local
    container_name: student_enrollment_api
    restart: unless-stopped
    init: true

    environment:
      APP_ENV: docker
      APP_PORT: 8081
      HTTP_READ_TIMEOUT: 10s
      HTTP_WRITE_TIMEOUT: 10s
      HTTP_IDLE_TIMEOUT: 60s
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      UPLOAD_DIR: /app/uploads

    depends_on:
      postgres:
        condition: service_healthy

      migrate:
        condition: service_completed_successfully

      uploads-init:
        condition: service_completed_successfully

    ports:
      - "8081:8081"

    volumes:
      - student_uploads:/app/uploads

    networks:
      - student_network

  gui:
    build:
      context: ./django_frontend
      dockerfile: Dockerfile

    image: student-enrollment-gui:local
    container_name: student_enrollment_gui
    restart: unless-stopped
    init: true

    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,0.0.0.0,gui}
      DJANGO_SECURE_SSL_REDIRECT: ${DJANGO_SECURE_SSL_REDIRECT:-false}
      DJANGO_SESSION_COOKIE_SECURE: ${DJANGO_SESSION_COOKIE_SECURE:-false}
      DJANGO_CSRF_COOKIE_SECURE: ${DJANGO_CSRF_COOKIE_SECURE:-false}
      DJANGO_SECURE_HSTS_SECONDS: ${DJANGO_SECURE_HSTS_SECONDS:-0}
      DJANGO_SECURE_HSTS_INCLUDE_SUBDOMAINS: ${DJANGO_SECURE_HSTS_INCLUDE_SUBDOMAINS:-false}
      DJANGO_SECURE_HSTS_PRELOAD: ${DJANGO_SECURE_HSTS_PRELOAD:-false}
      DJANGO_TRUST_PROXY_SSL_HEADER: ${DJANGO_TRUST_PROXY_SSL_HEADER:-false}
      DJANGO_DB_PATH: /app/data/db.sqlite3
      GO_API_BASE_URL: http://api:8081
      GO_API_PUBLIC_URL: ${GO_API_PUBLIC_URL:-http://localhost:8081}
      GO_API_TIMEOUT: 10
      DJANGO_SYNC_SEMATEC_ON_START: ${DJANGO_SYNC_SEMATEC_ON_START:-true}
      SEMATEC_SYNC_DELAY: ${SEMATEC_SYNC_DELAY:-0.2}

    depends_on:
      api:
        condition: service_started

    ports:
      - "8000:8000"

    volumes:
      - django_data:/app/data

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >
          import urllib.request;
          urllib.request.urlopen(
          'http://localhost:8000/',
          timeout=4
          )
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

    networks:
      - student_network

  uploads-init:
    image: alpine:3.20
    container_name: student_enrollment_uploads_init
    restart: "no"
    user: "0:0"
    network_mode: "none"

    command:
      - /bin/sh
      - -c
      - >
        mkdir -p /app/uploads
        && chown -R 65532:65532 /app/uploads
        && chmod 0750 /app/uploads

    volumes:
      - student_uploads:/app/uploads

  migrate:
    image: postgres:16-alpine
    container_name: student_enrollment_migrate
    restart: "no"

    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}

    depends_on:
      postgres:
        condition: service_healthy

    volumes:
      - ./migrations:/migrations:ro

    command:
      - /bin/sh
      - -ec
      - |
        for migration_file in /migrations/*.up.sql; do
          migration_name="$$(basename "$$migration_file")"
          migration_version="$${migration_name%%_*}"

          migration_table_exists="$$(
            psql \
              --host=postgres \
              --username=${POSTGRES_USER} \
              --dbname=${POSTGRES_DB} \
              --tuples-only \
              --no-align \
              --command="SELECT to_regclass('public.schema_migrations') IS NOT NULL;"
          )"

          if [ "$$migration_table_exists" = "t" ]; then
            migration_applied="$$(
              psql \
                --host=postgres \
                --username=${POSTGRES_USER} \
                --dbname=${POSTGRES_DB} \
                --tuples-only \
                --no-align \
                --command="SELECT EXISTS (
                  SELECT 1
                  FROM schema_migrations
                  WHERE version = '$$migration_version'
                );"
            )"

            if [ "$$migration_applied" = "t" ]; then
              echo "Skipping $$migration_name (already applied)."
              continue
            fi
          fi

          echo "Applying $$migration_name..."

          psql \
            --host=postgres \
            --username=${POSTGRES_USER} \
            --dbname=${POSTGRES_DB} \
            --set=ON_ERROR_STOP=1 \
            --file="$$migration_file"

          echo "Applied $$migration_name successfully."
        done

        echo "All database migrations are up to date."

    networks:
      - student_network

  postgres:
    image: postgres:16-alpine
    container_name: student_enrollment_postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"

    volumes:
      - student_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

    networks:
      - student_network

  adminer:
    image: adminer:4
    container_name: student_enrollment_adminer
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    ports:
      - "18080:8080"

    networks:
      - student_network

volumes:
  student_postgres_data:
    name: student_enrollment_postgres_data

  student_uploads:
    name: student_enrollment_uploads

  django_data:
    name: student_enrollment_django_data

networks:
  student_network:
    name: student_enrollment_network